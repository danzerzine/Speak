# Builds the app and runs the tests on every pull request (Dependabot's too) and
# on main, so a dependency bump is proven to build before it is merged.
# Package versions come from Package.swift (scripts/sync-packages.py), the file
# Dependabot updates.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen

      - name: Project from Package.swift versions
        run: |
          python3 scripts/sync-packages.py
          xcodegen generate

      - name: Build the app
        run: |
          xcodebuild -project Speak.xcodeproj -scheme Speak -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Tests
        run: swift test
